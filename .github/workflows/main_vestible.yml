# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - vestible

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: npm install, build, and test
        run: |
          npm ci --omit=dev
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact for deployment job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2151AAAED8BD4205A4813A5BA15A5945 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E59F7EC91CC84FA68AEBD5530C56B069 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_436404B8B7B342F7BBB611905C9B8B91 }}

      - name: Configure Azure Node.js runtime
        shell: bash
        run: |
          resource_group=$(az webapp list --query "[?name=='vestible'].resourceGroup | [0]" -o tsv)
          az webapp config appsettings set \
            --resource-group "$resource_group" \
            --name vestible \
            --settings WEBSITE_NODE_DEFAULT_VERSION="20.19.5" WEBSITES_PORT="3000" SCM_DO_BUILD_DURING_DEPLOYMENT="true" ENABLE_ORYX_BUILD="true"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: vestible
          slot-name: Production
          package: .

      - name: Capture Azure application logs
        shell: bash
        run: |
          resource_group=$(az webapp list --query "[?name=='vestible'].resourceGroup | [0]" -o tsv)
          az webapp log config \
            --resource-group "$resource_group" \
            --name vestible \
            --application-logging filesystem \
            --level information
          timeout 20 az webapp log tail \
            --resource-group "$resource_group" \
            --name vestible || true
