<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vestible — Entrar</title>
<link rel="icon" href="assets/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-shell">
  <div class="login-side">
    <div class="logo-wrap">
      <img src="assets/logo.svg" alt="">
      <span aria-label="VESTIBLE">ESTIBLE</span>
    </div>
    <blockquote>"O sucesso no vestibular é construído questão por questão."</blockquote>
  </div>

  <div class="login-form-side">
    <form class="login-form" id="loginForm">
      <h1>Bem-vindo de volta</h1>
      <p class="lead">Entre para continuar sua sequência de estudos</p>

      <div class="error-msg" id="errorMsg">Preencha e-mail e senha para entrar.</div>

      <div class="field">
        <label for="email">E-mail</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
        </div>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Entrar</button>

      <p class="switch-line">Ainda não tem conta? <b id="toRegister">Criar conta grátis</b></p>
    </form>
  </div>
</div>

<script src="js/app.js?v=20261123"></script>
<script>
  // icons for the input fields
  document.querySelectorAll('.input-wrap')[0].insertAdjacentHTML('afterbegin', ICON.mail);
  const pwWrap = document.querySelectorAll('.input-wrap')[1];
  pwWrap.insertAdjacentHTML('afterbegin', ICON.lock);
  pwWrap.insertAdjacentHTML('beforeend', `<span class="toggle-eye" style="position:absolute;">${ICON.eye}</span>`);
  pwWrap.querySelector('.toggle-eye').addEventListener('click', () => {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  });

  let cadastro = false;

  function showLogin(){
    cadastro = false;
    document.querySelector(".login-form h1").textContent = "Bem-vindo de volta";
    document.querySelector(".login-form .lead").textContent = "Entre para continuar seus estudos";
    document.getElementById("registerNameField")?.remove();
    document.getElementById("confirmEmailField")?.remove();
    document.getElementById("confirmField")?.remove();
    document.querySelectorAll(".field").forEach(field => field.style.display = "");
    document.getElementById("email").disabled = false;
    document.getElementById("password").disabled = false;
    document.querySelector(".btn-primary").textContent = "Entrar";
    document.querySelector(".switch-line").innerHTML = `Ainda não tem conta? <b id="toRegister">Criar conta grátis</b>`;
    document.getElementById("toRegister").addEventListener("click", showRegister);
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
  }

  function showRegister(){
    cadastro = true;
    document.querySelectorAll(".field").forEach(field => field.style.display = "");
    document.getElementById("email").disabled = false;
    document.getElementById("password").disabled = false;
    document.querySelector(".login-form h1").textContent = "Criar sua conta";
    document.querySelector(".login-form .lead").textContent = "Cadastre-se para começar seus estudos";
    if(!document.getElementById("registerNameField")){
      const nameField = document.createElement("div");
      nameField.className = "field";
      nameField.id = "registerNameField";
      nameField.innerHTML = `<label for="registerName">Nome</label><div class="input-wrap"><input id="registerName" autocomplete="name" placeholder="Seu nome"></div>`;
      document.querySelector(".field").before(nameField);
    }
    if(!document.getElementById("confirmEmailField")){
      const confirmEmailField = document.createElement("div");
      confirmEmailField.className = "field";
      confirmEmailField.id = "confirmEmailField";
      confirmEmailField.innerHTML = `<label for="confirmEmail">Confirmar e-mail</label><div class="input-wrap"><input type="email" id="confirmEmail" autocomplete="email" placeholder="Repita o e-mail"></div>`;
      document.querySelector(".field").before(confirmEmailField);
    }
    if(!document.getElementById("confirmField")){
      const confirmField = document.createElement("div");
      confirmField.className = "field";
      confirmField.id = "confirmField";
      confirmField.innerHTML = `<label for="confirmPassword">Confirmar senha</label><div class="input-wrap"><input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Repita a senha"></div>`;
      document.querySelector(".btn-primary").before(confirmField);
    }
    document.querySelector(".btn-primary").textContent = "Criar conta";
    document.querySelector(".switch-line").innerHTML = `Já tem conta? <b id="toLogin">Entrar com uma conta existente</b>`;
    document.getElementById("toLogin").addEventListener("click", showLogin);
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value.trim();
    const err = document.getElementById('errorMsg');
    if(!email){
      err.textContent = "Informe seu e-mail.";
      err.classList.add('show');
      document.getElementById("email").focus();
      return;
    }
    if(!pass){
      err.textContent = "Informe sua senha.";
      err.classList.add("show");
      document.getElementById("password").focus();
      return;
    }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      err.textContent = "Informe um e-mail válido.";
      err.classList.add("show");
      document.getElementById("email").focus();
      return;
    }
    if(cadastro){
      const name = document.getElementById("registerName")?.value.trim();
      const confirmEmail = document.getElementById("confirmEmail")?.value.trim();
      const confirmation = document.getElementById("confirmPassword")?.value;
      if(!name){
        err.textContent = "Informe seu nome.";
        err.classList.add("show");
        document.getElementById("registerName")?.focus();
        return;
      }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        err.textContent = "Informe um e-mail válido.";
        err.classList.add("show");
        document.getElementById("email").focus();
        return;
      }
      if(!confirmEmail){
        err.textContent = "Confirme seu e-mail digitando-o novamente.";
        err.classList.add("show");
        document.getElementById("confirmEmail")?.focus();
        return;
      }
      if(email !== confirmEmail.toLowerCase()){
        err.textContent = "A confirmação do e-mail não coincide.";
        err.classList.add("show");
        document.getElementById("confirmEmail")?.focus();
        return;
      }
      if(pass.length < 8){
        err.textContent = "A senha deve ter pelo menos 8 caracteres.";
        err.classList.add("show");
        document.getElementById("password").focus();
        return;
      }
      if(pass !== confirmation){
        err.textContent = "A confirmação da senha não coincide.";
        err.classList.add("show");
        document.getElementById("confirmPassword")?.focus();
        return;
      }
    }
    err.classList.remove('show');
    try {
      let data;
      data = cadastro
        ? await api("/api/auth/register", {
          method:"POST",
          body:JSON.stringify({
            nome: document.getElementById("registerName").value.trim(),
            email,
            confirmacao_email: document.getElementById("confirmEmail").value.trim(),
            senha: pass,
            confirmacao: document.getElementById("confirmPassword").value
          })
        })
        : await api("/api/auth/login", { method:"POST", body:JSON.stringify({ email, senha:pass }) });
      localStorage.setItem("vestible_token", data.token);
      localStorage.setItem("vestible_user", JSON.stringify(data.user));
      window.location.href = data.user.tipo === "admin" ? "admin.html" : "dashboard.html";
    } catch(error) {
      err.textContent = error.message;
      err.classList.add("show");
      if(error.field === "nome") document.getElementById("registerName")?.focus();
      if(error.field === "email") document.getElementById("email")?.focus();
      if(error.field === "confirmacao_email") document.getElementById("confirmEmail")?.focus();
      if(error.field === "senha") document.getElementById("password")?.focus();
      if(error.field === "confirmacao") document.getElementById("confirmPassword")?.focus();
    }
  });

  document.getElementById('toRegister').addEventListener('click', showRegister);
</script>
</body>
</html>
